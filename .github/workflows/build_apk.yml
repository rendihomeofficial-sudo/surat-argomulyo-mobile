name: Build Android APK (Flutter) & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surat-Argomulyo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Surat Argomulyo Mobile v1.0.1 Resmi (Perbaikan Layar)"
          body: |
            ### 📱 Aplikasi Resmi Persuratan & Administrasi Desa Kampung Argomulyo v1.0.1
            - **Perbaikan Krusial:** 
              - Mengatasi tampilan blank hitam saat instalasi di HP Android.
              - Inisialisasi Android WebView Platform asli dengan User-Agent resmi.
              - Penambahan tema responsif terang (`values-night/styles.xml`) agar tidak terpengaruh Dark Mode OS.
              - Penanganan galat koneksi internet ramah pengguna.
            - **Fitur Utama:**
              - Fitur Auto-Update OTA otomatis tanpa galat izin.
              - Menu Sidebar Lengkap: Surat Umum, Dukcapil, NA Nikah, SKBD, Validasi TTE.
            - **Unduh Langsung:** Silakan unduh berkas **`app-release.apk`** di bawah ini.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
