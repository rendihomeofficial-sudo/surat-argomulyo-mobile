name: Build Android APK (Flutter) & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surat-Argomulyo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "Surat Argomulyo Mobile v1.0.6 Resmi (Auto-Update Otomatis & Keystore Permanen)"
          body: |
            ### 📱 Aplikasi Resmi Persuratan & Administrasi Desa Kampung Argomulyo v1.0.6
            - **Pembaruan Sistem & Stabilitas Update Otomatis:**
              1. **Kunci Tanda Tangan APK Permanen (Release Keystore):** Memperbaiki masalah bentrok paket pembaruan (*App not installed / Signature mismatch*) dengan menggunakan sertifikat penandatanganan rilis yang konsisten secara permanen.
              2. **Update Otomatis Dalam Aplikasi (In-App Auto-Update):** Pop-up notifikasi pembaruan langsung mengunduh dan memasang aplikasi secara instan tanpa perlu unduh manual dari browser.
              3. **Optimalisasi Dialog & Installer:** Dialog progres interaktif dan pemanggilan installer paket yang kompatibel untuk Android 8.0 s.d. Android 14+.
            - **Unduh APK:** Klik dan unduh file **`app-release.apk`** di bawah (atau perbarui langsung dari dalam aplikasi).
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
