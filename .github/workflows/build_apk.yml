name: Build Android APK (Flutter) & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surat-Argomulyo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Surat Argomulyo Mobile v1.0.4 Resmi (Perbaikan Tata Letak Mobile & Buku Tamu)"
          body: |
            ### 📱 Aplikasi Resmi Persuratan & Administrasi Desa Kampung Argomulyo v1.0.4
            - **Perbaikan Menyeluruh Tampilan & Tata Letak Mobile:**
              1. **Perbaikan Panel Sticky Kependudukan:** Mengatasi bug lembar pratinjau bertumpuk/terpotong di layar HP (`ktp.html`, `f205_kelahiran.html`, `f106_ubah_biodata.html`, `f228_kematian.html`).
              2. **Auto-fit Preview A3 & F4:** Pratinjau formulir F-1.01 Biodata KK A3 dan formulir kependudukan kini otomatis menyesuaikan lebar layar smartphone secara presisi.
              3. **Integrasi Menu Sidebar Buku Tamu:** Menambahkan menu langsung Buku Tamu Pelayanan Balai Kampung di sidebar drawer navigasi aplikasi.
            - **Fitur Utama:**
              - Layar loading elegan berlogo resmi desa.
              - Menu sidebar interaktif lengkap 7 kategori layanan desa.
              - In-app Auto-Update cerdas dari GitHub Release.
            - **Unduh APK:** Klik dan unduh file **`app-release.apk`** di bawah.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
