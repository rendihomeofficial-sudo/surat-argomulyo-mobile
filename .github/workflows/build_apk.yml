name: Build Android APK (Flutter) & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surat-Argomulyo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "Surat Argomulyo Mobile v1.0.7 Resmi (Perbaikan Layar Hitam, Kedip & Performa Halus)"
          body: |
            ### 📱 Aplikasi Resmi Persuratan & Administrasi Desa Kampung Argomulyo v1.0.7
            - **Perbaikan Masalah Tampilan & Performa Super Ringan:**
              1. **Perbaikan Layar Hitam & Kedip (Blink-Blink):** Mengganti mode rendering WebView ke *Hardware-Accelerated SurfaceView* asli Android, melenyapkan glitch layar hitam, kedip, dan animasi patah-patah saat berpindah menu.
              2. **Pemuatan Halaman Instan (Anti-Stuck):** Menghilangkan overlay loading layar penuh yang kaku; digantikan dengan progress bar responsif di AppBar dan indikator ringan non-blocking sehingga layar tidak akan pernah macet/blank.
              3. **Optimalisasi Scroll & Responsivitas:** Mengaktifkan `OverScrollMode.never` dan penanganan cache DOM storage untuk mencegah lagging saat mengisi formulir panjang.
            - **Unduh APK:** Klik dan unduh file **`app-release.apk`** di bawah (atau perbarui langsung dari notifikasi pop-up di dalam aplikasi).
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
