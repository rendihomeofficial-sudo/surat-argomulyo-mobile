name: Build Android APK (Flutter) & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surat-Argomulyo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Surat Argomulyo Mobile v1.0.3 Resmi (Perbaikan Layar Hitam & Riwayat Surat)"
          body: |
            ### 📱 Aplikasi Resmi Persuratan & Administrasi Desa Kampung Argomulyo v1.0.3
            - **Perbaikan Tuntas Masalah Layar Hitam (Black Screen):**
              1. **Texture Render Mode:** Mengalihkan render mode engine Flutter native (`MainActivity.kt`) dari `RenderMode.surface` ke `RenderMode.texture`, menghilangkan bug *black canvas freeze* pada GPU perangkat Android.
              2. **Hybrid Composition:** Mengaktifkan `displayWithHybridComposition: true` pada widget WebView Android untuk integrasi visual langsung dengan antarmuka native OS.
              3. **Splash Screen Bersih:** Memperbarui `launch_background.xml` (dan `drawable-v21`) menggunakan layer solid background putih murni tanpa bitmap layer conflict.
            - **Fitur Utama:**
              - Layar loading elegan berlogo resmi desa.
              - Menu sidebar interaktif lengkap 6 kategori.
              - In-app Auto-Update cerdas dari GitHub Release.
            - **Unduh APK:** Klik dan unduh file **`app-release.apk`** di bawah.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
