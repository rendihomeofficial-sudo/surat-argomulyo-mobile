name: Build Android APK (Flutter) & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surat-Argomulyo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Surat Argomulyo Mobile v1.0.0 Resmi"
          body: |
            ### 📱 Aplikasi Resmi Persuratan & Administrasi Desa Kampung Argomulyo
            - **Paket:** `com.argomulyo.surat`
            - **Fitur:** 
              - Sidebar Navigation Drawer Material 3
              - Integrasi 22 Jenis Surat Umum (SKU, SKCK, Domisili, dll.)
              - Layanan Kependudukan & Dukcapil
              - Formulir Nikah (NA N1 - N7)
              - Surat Keterangan Bersih Diri (SKBD)
              - Pemindai & Verifikasi Dokumen TTE BSrE
            - **Unduh Langsung:** Silakan unduh berkas **`Surat-Argomulyo-v1.0.0.apk`** di bawah ini untuk dipasang di HP Android.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
