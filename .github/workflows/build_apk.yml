name: Build Android APK (Flutter) & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surat-Argomulyo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Surat Argomulyo Mobile v1.0.5 Resmi (Audit Menyeluruh & Ekspor CSV)"
          body: |
            ### 📱 Aplikasi Resmi Persuratan & Administrasi Desa Kampung Argomulyo v1.0.5
            - **Pembaruan & Penyempurnaan Menyeluruh (Audit Release):**
              1. **Sinkronisasi Judul AppBar Otomatis:** Judul aplikasi di bagian atas otomatis berganti mengikuti halaman yang sedang dibuka oleh pengguna (Kependudukan, SKBD, NA Nikah, Buku Tamu, dll).
              2. **Download & Ekspor Berkas Laporan:** Integrasi penanganan otomatis unduh berkas CSV Agenda Surat & Buku Tamu yang langsung dibuka melalui aplikasi spreadsheet/Office di smartphone.
              3. **Optimalisasi Tata Letak Formulir Mobile:** Penyesuaian responsif mobile pada menu navigasi portal horizontal dan seluruh panel kependudukan (`f103_pindah.html`, `f101_biodata_kk.html`, dll).
            - **Fitur Utama:**
              - Layar loading elegan berlogo resmi desa.
              - Menu sidebar interaktif lengkap 7 kategori layanan desa.
              - In-app Auto-Update cerdas dari GitHub Release.
            - **Unduh APK:** Klik dan unduh file **`app-release.apk`** di bawah.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
